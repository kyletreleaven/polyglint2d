# https://www.mkdocs.org/user-guide/configuration/#build-directories

site_name: polyglint2d
site_dir: build/site
theme:
  # name: material
  # name: readthedocs
  name: terminal
  # code_style: monokai

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            members_order: source
            show_source: false
            # show_root_toc_entry: true
            # show_root_heading: true
            extra:
              source_link_format: "https://github.com/kyletreleaven/polyglint2d/blob/master/{path}#L{lineno}"


nav:
  - Home: index.md
  - API: api.md

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
